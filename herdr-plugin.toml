id = "herdr-loop"
name = "herdr-loop"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Declarative, event-driven multi-agent loops across any mix of herdr's coding agents"
platforms = ["linux", "macos", "windows"]
repository = "https://github.com/cyperx84/herdr-loop"
license = "MIT"
authors = ["cyperx84"]

# Compiled Go plugin (PLAN.md §7): prefer a local toolchain build for an exact
# source match, fall back to a SHA256-verified prebuilt from GitHub Releases.
# Runs once, on `plugin install`, after user confirmation — not on `plugin
# link`, which is how this repo is exercised during development.
[[build]]
platforms = ["linux", "macos"]
command = ["sh", "scripts/build.sh"]

# No POSIX sh on Windows, so no download fallback there (PLAN.md §7) — a local
# Go toolchain is required. This is the one place platforms diverge from the
# top-level list above; herdr requires the intersection to be non-empty per
# manifest, which it is.
[[build]]
platforms = ["windows"]
command = ["go", "build", "-o", "bin/herdr-loop.exe", "./cmd/herdr-loop"]

# Paths are "./bin/..." rather than "bin/...": herdr resolves a bare relative
# command through PATH, not the plugin root, so the unprefixed form silently
# fails to launch for anyone who installs this. Learned from herdr-sesh-bro,
# where exactly this broke every action and the startup hook.
#
# Every action shells out to the same binary [[build]] produced. None of these
# take user-entered arguments — herdr actions have no argument prompt UI as of
# 0.8.0. `run` takes no manifest argument here on purpose: [config] values
# reach the process as HERDR_LOOP_* environment variables (confirmed against
# herdr-sesh-bro's installed, working manifest — SESH_BRO_* for plugin id
# "sesh-bro" — not a {{config.x}} command-template placeholder, which herdr's
# own plugin docs do not document anywhere and this manifest does not guess
# at), and `run` reads HERDR_LOOP_DEFAULT_MANIFEST itself (main.go),
# defaulting to "loop.toml" when unset.
[[actions]]
id = "run"
title = "herdr-loop: run"
description = "Start the loop defined in the configured manifest"
contexts = ["workspace"]
command = ["./bin/herdr-loop", "run"]

[[actions]]
id = "status"
title = "herdr-loop: status"
description = "Show the live state of the running loop, if any"
contexts = ["workspace", "global"]
command = ["./bin/herdr-loop", "status"]

[[actions]]
id = "stop"
title = "herdr-loop: stop"
description = "Stop the running loop"
contexts = ["workspace", "global"]
command = ["./bin/herdr-loop", "stop"]

# Status board: a persistent pane the supervisor's `run` invocation lives in
# (PLAN.md §2 — herdr owns the lifecycle, it dies with the server, it is
# visible and steerable, which is the whole point of running this as a pane
# rather than a detached [[startup]] daemon). Placed as a split so it sits
# alongside the slot panes it is reporting on, not hidden behind a tab.
# direction/height are documented against the plugin.pane.open socket method
# (herdr api schema's PluginPaneOpenParams/PopupSize/SplitDirection defs),
# which [[panes]] shares its param shape with — not guessed.
[[panes]]
id = "board"
title = "herdr-loop"
placement = "split"
direction = "down"
height = "30%"
command = ["./bin/herdr-loop", "run"]

# Reaches the process as HERDR_LOOP_DEFAULT_MANIFEST / HERDR_LOOP_KINDS_FILE /
# HERDR_LOOP_RECONCILE_INTERVAL_SECS / HERDR_LOOP_LOG_LEVEL — herdr uppercases
# the plugin id, turns "-" into "_", and prefixes every [config] key with it
# (empirical convention, confirmed against herdr-sesh-bro's shipped, working
# plugin: id "sesh-bro" -> SESH_BRO_*). cmd/herdr-loop reads these directly
# (see envOr/envOrInt in main.go) with the same defaults given here.
[config]
default_manifest = { type = "string", default = "loop.toml" }
kinds_file = { type = "string", default = "kinds.toml" }
reconcile_interval_secs = { type = "integer", default = 30 }
log_level = { type = "string", default = "info" }

[default_config]
default_manifest = "loop.toml"
kinds_file = "kinds.toml"
reconcile_interval_secs = 30
log_level = "info"
