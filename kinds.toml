# Per-harness capabilities for herdr-loop.
#
# Everything here is MEASURED, not assumed. Each entry came from
# `herdr-loop probe <kind>`, which runs the harness through the same lifecycle
# the engine runs and reports what it actually did. Re-run the probe after a
# harness updates rather than trusting this file to have aged well.
#
# Kinds with no entry still work: they inherit max_concurrent = 1 and no
# startup sequence, which is the safe assumption for a harness nobody has
# measured. Probe one and add it.
#
# ── Verified tier ─────────────────────────────────────────────────────────────
# Four harnesses are measured and exercised in real loops. Probe results,
# herdr 0.8.0, 2026-08-11:
#
#   kind      detection    interactive   first turn   notes
#   pi        structured   3.13s         0.50s        fastest; best reviewer
#   opencode  structured   3.12s         33.54s       slow turns; keyless/free
#   claude    screen       3.02s         2.51s        pin --permission-mode
#   codex     screen       3.02s         1.00s        trusts a new dir on first run
#   copilot   screen       3.03s         1.00s        multi-line paste needs staged submit
#   kilo      screen       3.25s         2.51s        2 retries on pane readiness
#   grok      screen       3.03s         3.01s        slowest to accept a prompt
#
# Measured and NOT usable in a loop:
#   kimi      prompt never lands — agent_prompt_stalled, and the agent really
#             did not start (corroborated, not a timing artifact)
#   gemini    accepts a prompt, then never finishes a turn — a loop cannot
#             advance past a slot that never settles
#
# "structured" means the agent reports its own lifecycle state. "screen" means
# herdr infers it from the rendered terminal — a heuristic, and one a strict
# loop refuses to act on (PLAN.md §4.6). As of herdr 0.8.0 that means a strict
# loop runs on pi and opencode only.

# ── Claude Code ───────────────────────────────────────────────────────────────
[claude]
# Plan mode turns "implement this" into "write a plan for this": the agent
# reports working, finishes, reports done, and has changed nothing — so a gate
# fails forever on work that was never attempted, and nothing in the lifecycle
# explains why.
#
# Do NOT fix this with keystrokes. Pin it at spawn, in the slot:
#
#     args = ["--model", "sonnet", "--permission-mode", "acceptEdits"]
#
# Two reasons, both learned by getting it wrong. A pane launched by herdr-loop
# inherits the launching environment's plan mode, so toggling afterwards races
# the agent's own startup and is unreliable. And the escape sequence this entry
# used to send is not accepted by herdr 0.8.0: of "shift+tab", "S-Tab",
# "BackTab" and the raw "\e[Z", only "shift+tab" is a valid key at all, and
# even that only helps if it lands before the first prompt.
#
# Valid --permission-mode values: acceptEdits, auto, bypassPermissions,
# manual, plan.
startup_settle_ms = 500
max_concurrent    = 1

# ── Pi ────────────────────────────────────────────────────────────────────────
[pi]
# The most reliable harness measured: takes a prompt immediately, finishes a
# turn in well under a second, and self-reports its state. Best default for a
# reviewer slot. Keep the cap low — pi routes through a subscription.
max_concurrent = 1

# ── OpenCode ──────────────────────────────────────────────────────────────────
[opencode]
# Self-reporting, and keyless on free models, so concurrency here races no
# credential and costs nothing.
max_concurrent = 3
# Turns are slow — ~34s in the probe, and minutes against a busy free endpoint.
# A loop stays healthy and simply waits, which is correct, but do not put
# opencode on the critical path of something you are watching.
#
# No settle needed. An earlier version of this file claimed
# startup_settle_ms = 6000 on the strength of hand-observed stalls; the probe
# disproved it. Those stalls were the pane being squeezed to a sliver by
# repeated splitting, fixed since by giving each slot its own tab. Recorded
# because it is the argument for probing rather than remembering.

# ── Codex ─────────────────────────────────────────────────────────────────────
[codex]
# Screen-classified, so a strict loop will refuse it until that changes
# upstream. Shares a ChatGPT credential, hence one at a time.
max_concurrent = 1
# The first time codex starts in a directory it has not seen, it asks whether
# it trusts the contents — a prompt-injection warning — and that lands as
# `blocked`. The loop escalates and halts the slot rather than answering:
# pressing enter there would be an agent granting itself trust over contents it
# was explicitly warned about. Answer it yourself once, in that directory,
# before putting codex in a loop.

# ── Copilot ───────────────────────────────────────────────────────────────────
[copilot]
max_concurrent = 1
# herdr 0.8.0 sends a bracketed-paste payload and then Enter after a fixed
# 300ms. Copilot imports multi-line pastes asynchronously; long loop prompts
# can still be importing when Enter arrives, so the key is discarded and the
# agent stays idle. One-line probes bypass that paste path and hid the failure.
# Stage the paste, let Copilot finish importing it, then submit through
# agent.prompt so herdr's active-agent and lifecycle checks remain in force.
multiline_paste_settle_ms = 1000

# ── Kilo ──────────────────────────────────────────────────────────────────────
[kilo]
# Needed two retries before its pane was an available shell — handled by the
# engine's agent_pane_busy retry, noted because it is the slowest starter of
# the working set.
max_concurrent = 1

# ── Grok ──────────────────────────────────────────────────────────────────────
[grok]
# Slowest to accept a prompt (~3.5s from delivery to working) but reliable.
max_concurrent = 1

# ── Known NOT usable ──────────────────────────────────────────────────────────
# kimi:   prompts never land. herdr reports agent_prompt_stalled and the agent
#         genuinely does not start — corroborated by polling its status, so
#         this is a real failure rather than herdr's 5s window being short.
# gemini: accepts a prompt and starts, then never settles. A loop cannot
#         advance past a slot that never finishes a turn.
# Both re-probe in seconds if that changes upstream: `herdr-loop probe kimi`.

# ── Everything else ───────────────────────────────────────────────────────────
# gemini, cursor, amp, droid, kimi, grok, hermes, copilot, kilo, qodercli,
# maki, cline, agy, omp, devin, kiro, mastracode are recognised by herdr and
# should work, but none has been probed. Run `herdr-loop probe <kind>` and add
# what it prints — an unmeasured claim in this file would be exactly the kind
# of thing the probe exists to stop.
